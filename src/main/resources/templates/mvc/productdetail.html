<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/header :: header}"></div>

<body>
<h1>Product Detail</h1>

<p>
    <a href="/dashboard/dashboard.html">Back to Dashboard</a>
</p>

<p>
    <a th:href="@{/catalog(edit=false)}">Back to the Catalog</a>

</p>

<div th:if="${product!=null}">
    <h2 th:text="${product.name}">Product Name</h2>
    <ul>
        <li><b>Id:</b><span th:text="${product.id}"></span></li>
        <li><b>Price:</b><span th:text="${product.price}"></span></li>
        <li><b>Color:</b><span th:text="${product.color}"></span></li>
            <li>            <form th:action ="@{/cart-add/{id}(id=${product.id})}" method="POST"><button type="submit">+</button> </form>
            </li>
        <li>            <form th:action ="@{/cart-remove/{id}(id=${product.id})}" method="POST"><button type="submit">-</button> </form>
        </li>








    </ul>



</div>

<p th:if="${product == null}">Product not found</p>
</body>
</html>
