<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/header :: header}"></div>

<body>
<h1>Product Catalog</h1>

<p>
    <a href="/dashboard/dashboard.html">Back to Dashboard</a>
</p>


<a th:href="@{/catalog(edit=true)}">Enable Edit mode</a>
<a th:href="@{/catalog(edit=false)}">Disable Edit mode</a>
<form th:action ="@{/catalog}" method="get">
<div th:each="p:${uniqueColor}">
    <input type="checkbox" name="color" th:value="${p}" th:checked ="${color !=null and color.contains(p)}">
    <label th:text="${p}"></label>
 </div>
    <button type ="submit">Filter</button>

</form>

<td th:text ="${currentPage}"></td>
<a th:if="${hasNext}" th:href="@{/catalog-paginated(page=${page.number+1})}">Next</a>
<a th:if="${hasPrevious}" th:href="@{/catalog-paginated(page=${page.number-1})}">Previous</a>
<td th:text ="${totalPage}"></td>


<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Price</th>
        <th>Color</th>
        <th>Open</th>
        <th th:if="${edit}">Delete</th>
    </tr>
    </thead>

    <tbody>
    <tr  th:each="p:${products}">
        <td th:text="${p.product.id}"></td>
        <td th:text="${p.product.name}"></td>
        <td th:text="${CurrentCurreny}+'   '+${p.displayprice}"></td>
        <td th:text="${p.product.color}"></td>
<!--        <td> <a th:href="@{/productdetail/{id}(id=${p.id})}">View</a></td>-->
        <td> <a th:href="@{/productfacade/{id}(id=${p.product.id})}">View</a></td>

        <td th:if="${edit}"><a th:href="@{/ProductCatalog/delete/{id}(id=${p.product.id})}">Delete</a></td>

    </tr>


    </tbody>


</table>
<p th:if="${#lists.isEmpty(products)}">No Products Available</p>
</body>
</html>
